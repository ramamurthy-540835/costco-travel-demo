services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.pgvector
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: rental
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
    volumes:
      - rental_graph_data:/var/lib/postgresql/data
      - ./init/01-init-graph.sql:/docker-entrypoint-initdb.d/01-init-graph.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rental"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rental_graph_data:
