services:
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - rental_mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" --quiet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rental_mongo_data:
